

<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Método de Pagamento | TicTag</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Favicon -->
    <link href="images/favicon.png" rel="shortcut icon" type="image/x-icon">
    
    <!-- CSS -->
    <link href="css/auth-pages.css?v=1" rel="stylesheet" type="text/css">
    
    <style>
        .payment-container {
            max-width: 800px;
            margin: 0 auto;
            padding: 60px 20px;
        }
        
        .payment-card {
            background: var(--branco);
            border-radius: 20px;
            padding: 50px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
        }
        
        .payment-title {
            font-size: 28px;
            font-weight: 700;
            color: var(--azul-escuro);
            text-align: center;
            margin-bottom: 40px;
        }
        
        .payment-methods {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 40px;
        }
        
        .payment-method {
            border: 3px solid var(--cinza-medio);
            border-radius: 15px;
            padding: 30px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .payment-method:hover {
            border-color: var(--roxo);
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(74, 29, 111, 0.2);
        }
        
        .payment-method.active {
            border-color: var(--roxo);
            background: linear-gradient(135deg, rgba(139, 95, 191, 0.1) 0%, rgba(74, 29, 111, 0.05) 100%);
        }
        
        .payment-method-icon {
            font-size: 48px;
            margin-bottom: 15px;
        }
        
        .payment-method-name {
            font-size: 18px;
            font-weight: 600;
            color: var(--azul-escuro);
        }
        
        .payment-form {
            display: none;
        }
        
        .payment-form.active {
            display: block;
        }
        
        .card-brands {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-top: 20px;
            flex-wrap: wrap;
        }
        
        .card-brand {
            width: 50px;
            height: 32px;
            border: 1px solid var(--cinza-medio);
            border-radius: 5px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            font-weight: 600;
            color: #666;
        }
        
        .form-actions {
            display: flex;
            gap: 20px;
            margin-top: 30px;
        }
        
        .form-actions button,
        .form-actions a {
            flex: 1;
        }
        
        @media (max-width: 768px) {
            .payment-card {
                padding: 30px 20px;
            }
            
            .payment-methods {
                grid-template-columns: 1fr;
            }
            
            .payment-title {
                font-size: 22px;
            }
        }
    </style>
</head>
<body>
    <!-- ========== HEADER ========== -->
    <header class="auth-header">
        <div class="container">
            <a href="/lp-preview/" class="logo">
                <img src="images/tictag-logo-roxo.png" alt="TicTag">
            </a>
            
            <nav>
                <a href="/lp-preview/#inicio">Início</a>
                <a href="/lp-preview/#funcionalidades">Funcionalidades</a>
                <a href="/lp-preview/#planos">Planos</a>
                <a href="/login/" class="btn-login-header">Login</a>
            </nav>
        </div>
    </header>

    <!-- ========== CONTAINER PRINCIPAL ========== -->
    <div class="payment-container">
        <div class="payment-card">
            <h1 class="payment-title">Método de pagamento:</h1>
            
            <!-- Seleção de Método -->
            <div class="payment-methods">
                <div class="payment-method" id="pixMethod" onclick="selectPaymentMethod('pix')">
                    <div class="payment-method-icon">💳</div>
                    <div class="payment-method-name">Pix</div>
                </div>
                
                <div class="payment-method" id="creditMethod" onclick="selectPaymentMethod('credit')">
                    <div class="payment-method-icon">💳</div>
                    <div class="payment-method-name">Cartão de Crédito</div>
                </div>
            </div>

            <!-- Formulário PIX -->
            <div class="payment-form" id="pixForm">
                <div class="alert alert-info">
                    <p><strong>Pagamento via Pix</strong></p>
                    <p>Após confirmar, você será redirecionado para gerar o QR Code do Pix.</p>
                </div>
                
                <div class="form-actions">
                    <a href="/completar-cadastro/?plan={{ plan }}" class="btn-secondary">Voltar</a>
                    <button type="button" class="btn-primary" onclick="submitPayment('pix')">Próximo</button>
                </div>
            </div>

            <!-- Formulário Cartão de Crédito -->
            <div class="payment-form" id="creditForm">
                <form method="POST" action="#" class="auth-form" id="creditCardForm">
                    
                    <input type="hidden" name="payment_method" value="credit">
                    <input type="hidden" name="plan" value="{{ plan }}">
                    
                    <div class="form-group">
                        <label for="card_number">Número do cartão</label>
                        <input 
                            type="text" 
                            id="card_number" 
                            name="card_number" 
                            class="form-input" 
                            placeholder="0000 0000 0000 0000"
                            maxlength="19"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="card_holder">Titular</label>
                        <input 
                            type="text" 
                            id="card_holder" 
                            name="card_holder" 
                            class="form-input" 
                            placeholder="Nome como está no cartão"
                            required
                        >
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="card_expiry">Validade</label>
                            <input 
                                type="text" 
                                id="card_expiry" 
                                name="card_expiry" 
                                class="form-input" 
                                placeholder="MM/AA"
                                maxlength="5"
                                required
                            >
                        </div>

                        <div class="form-group">
                            <label for="card_cvv">CVV</label>
                            <input 
                                type="text" 
                                id="card_cvv" 
                                name="card_cvv" 
                                class="form-input" 
                                placeholder="000"
                                maxlength="4"
                                required
                            >
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="installments">Parcelas</label>
                        <select id="installments" name="installments" class="form-input" required>
                            <option value="">Selecione...</option>
                            <option value="1">1x sem juros</option>
                            <option value="2">2x sem juros</option>
                            <option value="3">3x sem juros</option>
                            <option value="4">4x sem juros</option>
                            <option value="5">5x sem juros</option>
                            <option value="6">6x sem juros</option>
                            <option value="7">7x sem juros</option>
                            <option value="8">8x sem juros</option>
                            <option value="9">9x sem juros</option>
                            <option value="10">10x sem juros</option>
                            <option value="11">11x sem juros</option>
                            <option value="12">12x sem juros</option>
                        </select>
                    </div>

                    <div class="card-brands">
                        <div class="card-brand">VISA</div>
                        <div class="card-brand">MASTER</div>
                        <div class="card-brand">ELO</div>
                        <div class="card-brand">AMEX</div>
                        <div class="card-brand">HIPER</div>
                    </div>

                    <div class="form-actions">
                        <a href="/completar-cadastro/?plan={{ plan }}" class="btn-secondary">Voltar</a>
                        <button type="submit" class="btn-primary">Próximo</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script>
        let selectedMethod = null;

        function selectPaymentMethod(method) {
            selectedMethod = method;
            
            // Remover active de todos
            document.getElementById('pixMethod').classList.remove('active');
            document.getElementById('creditMethod').classList.remove('active');
            document.getElementById('pixForm').classList.remove('active');
            document.getElementById('creditForm').classList.remove('active');
            
            // Adicionar active no selecionado
            if (method === 'pix') {
                document.getElementById('pixMethod').classList.add('active');
                document.getElementById('pixForm').classList.add('active');
            } else {
                document.getElementById('creditMethod').classList.add('active');
                document.getElementById('creditForm').classList.add('active');
            }
        }

        function submitPayment(method) {
            const urlParams = new URLSearchParams(window.location.search);
            const plan = urlParams.get('plan') || 'basico';
            window.location.href = '/confirmacao/?plan=' + plan + '&payment_method=' + method;
        }

        // Máscara para número do cartão
        document.getElementById('card_number').addEventListener('input', function(e) {
            let value = e.target.value.replace(/\D/g, '');
            value = value.replace(/(\d{4})(?=\d)/g, '$1 ');
            e.target.value = value;
        });

        // Máscara para validade
        document.getElementById('card_expiry').addEventListener('input', function(e) {
            let value = e.target.value.replace(/\D/g, '');
            if (value.length >= 2) {
                value = value.substring(0, 2) + '/' + value.substring(2, 4);
            }
            e.target.value = value;
        });

        // Máscara para CVV
        document.getElementById('card_cvv').addEventListener('input', function(e) {
            e.target.value = e.target.value.replace(/\D/g, '');
        });

        // Submissão do formulário de cartão
        document.getElementById('creditCardForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const urlParams = new URLSearchParams(window.location.search);
            const plan = urlParams.get('plan') || 'basico';
            window.location.href = '/confirmacao/?plan=' + plan + '&payment_method=credit';
        });
    </script>
</body>
</html>
