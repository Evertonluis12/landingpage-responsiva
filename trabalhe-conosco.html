

<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trabalhe Conosco | TicTag</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Favicon -->
    <link href="images/favicon.png" rel="shortcut icon" type="image/x-icon">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Poppins', sans-serif;
            background: #FAF8F3;
            color: #201F4B;
        }
        
        .header {
            background: #FAF8F3;
            padding: 20px 0;
            border-bottom: 1px solid #E5E5E5;
        }
        
        .header-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .logo img {
            height: 40px;
        }
        
        .header-nav {
            display: flex;
            gap: 30px;
            align-items: center;
        }
        
        .header-nav a {
            text-decoration: none;
            color: #201F4B;
            font-weight: 500;
            font-size: 14px;
        }
        
        .btn-login {
            background: #8B5FBF;
            color: white;
            padding: 10px 25px;
            border-radius: 25px;
            text-decoration: none;
            font-weight: 600;
        }
        
        .trabalhe-container {
            min-height: calc(100vh - 80px);
            background-image: url('{% static "landing_page/images/new/trabalhe-conosco-bg.jpg" %}');
            background-size: cover;
            background-position: center right;
            background-repeat: no-repeat;
            display: flex;
            align-items: center;
            justify-content: flex-start;
            padding: 60px 80px;
            position: relative;
        }
        
        .form-card {
            max-width: 420px;
            width: 100%;
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        
        .title-block {
            background: white;
            border: 1px solid #201F4B;
            border-radius: 20px;
            padding: 25px 30px;
            text-align: center;
        }
        
        .form-block {
            background: white;
            border: 1px solid #201F4B;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15);
        }
        
        .form-title {
            font-size: 22px;
            font-weight: 700;
            color: #201F4B;
            text-align: center;
            margin-bottom: 10px;
            line-height: 1.3;
        }
        
        .form-subtitle {
            font-size: 13px;
            color: #201F4B;
            text-align: center;
            margin-bottom: 0;
            line-height: 1.5;
            font-weight: 400;
        }
        
        .form-group {
            margin-bottom: 15px;
        }
        
        .form-group label {
            display: block;
            font-weight: 600;
            color: #201F4B;
            margin-bottom: 6px;
            font-size: 13px;
        }
        
        .form-input {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid #201F4B;
            border-radius: 10px;
            font-size: 14px;
            font-family: 'Poppins', sans-serif;
            transition: all 0.3s;
            background: white;
        }
        
        .form-input:focus {
            outline: none;
            border-color: #B5BAFE;
            background: white;
        }
        
        .form-input::placeholder {
            color: #201F4B;
            opacity: 0.6;
        }
        
        .btn-submit {
            width: 100%;
            background: #B5BAFE;
            color: #201F4B;
            padding: 16px 32px;
            border: none;
            border-radius: 30px;
            font-size: 16px;
            font-weight: 400;
            cursor: pointer;
            font-family: 'Poppins', sans-serif;
            transition: all 0.3s;
            margin-top: 10px;
        }
        
        .btn-submit:hover {
            background: #A0ABFD;
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(181, 186, 254, 0.4);
        }
        
        .success-message {
            display: none;
            background: #d4edda;
            border: 2px solid #28a745;
            border-radius: 15px;
            padding: 20px;
            text-align: center;
            margin-top: 20px;
            color: #155724;
        }
        
        .success-message.show {
            display: block;
        }
        
        @media (max-width: 768px) {
            .form-card {
                padding: 40px 30px;
            }
            
            .form-title {
                font-size: 24px;
            }
            
            .header-nav {
                display: none;
            }
            
            .trabalhe-container {
                padding: 40px 20px;
            }
        }
    </style>
</head>
<body>
    <!-- Header -->
    <div class="header">
        <div class="header-container">
            <a href="{% url 'landing_page:landingmain' %}" class="logo">
                <img src="images/tictag-logo-roxo.png" alt="TicTag">
            </a>
            <nav class="header-nav">
                <a href="{% url 'landing_page:landingmain' %}#inicio">Início</a>
                <a href="{% url 'landing_page:landingmain' %}#funcionalidades">Funcionalidades</a>
                <a href="{% url 'landing_page:landingmain' %}#planos">Planos</a>
                <a href="{% url 'landing_page:landingmain' %}#sobre">Sobre Nós</a>
                <a href="{% url 'landing_page:trabalhe_conosco_page' %}">Trabalhe Conosco</a>
                <a href="{% url 'landing_page:cadastro_page' %}">Cadastrar-se</a>
                <a href="{% url 'landing_page:login_page' %}" class="btn-login">Login</a>
            </nav>
        </div>
    </div>

    <!-- Container Principal -->
    <div class="trabalhe-container">
        <div class="form-card">
            <div class="title-block">
                <h1 class="form-title">Quer fazer parte do nosso time?</h1>
                <p class="form-subtitle">Preencha seus dados e entraremos em contato quando surgirem oportunidades!</p>
            </div>
            
            <div class="form-block">
                <form id="trabalheForm">
                <div class="form-group">
                    <label for="nome">Nome completo</label>
                    <input 
                        type="text" 
                        id="nome" 
                        name="nome" 
                        class="form-input" 
                        placeholder="Digite seu nome completo"
                        required
                    >
                </div>
                
                <div class="form-group">
                    <label for="email">E-mail</label>
                    <input 
                        type="email" 
                        id="email" 
                        name="email" 
                        class="form-input" 
                        placeholder="seu@email.com"
                        required
                    >
                </div>
                
                <div class="form-group">
                    <label for="telefone">Telefone</label>
                    <input 
                        type="tel" 
                        id="telefone" 
                        name="telefone" 
                        class="form-input" 
                        placeholder="(00) 00000-0000"
                        required
                    >
                </div>
                
                <button type="submit" class="btn-submit">Enviar!</button>
                
                <div class="success-message" id="successMessage">
                    ✅ Obrigado! Seus dados foram enviados com sucesso. Entraremos em contato em breve!
                </div>
                </form>
            </div>
        </div>
    </div>

    <script>
        // Máscara para telefone
        document.getElementById('telefone').addEventListener('input', function(e) {
            let value = e.target.value.replace(/\D/g, '');
            if (value.length <= 11) {
                value = value.replace(/^(\d{2})(\d{5})(\d{4}).*/, '($1) $2-$3');
                value = value.replace(/^(\d{2})(\d{4})(\d{0,4}).*/, '($1) $2-$3');
                value = value.replace(/^(\d{2})(\d{0,5})/, '($1) $2');
                value = value.replace(/^(\d*)/, '($1');
            }
            e.target.value = value;
        });

        // Submissão do formulário
        document.getElementById('trabalheForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const formData = {
                nome: document.getElementById('nome').value,
                email: document.getElementById('email').value,
                telefone: document.getElementById('telefone').value,
                timestamp: new Date().toISOString()
            };
            
            // Salvar no localStorage (em produção, enviar para backend)
            localStorage.setItem('trabalheConosco_' + Date.now(), JSON.stringify(formData));
            
            // Mostrar mensagem de sucesso
            document.getElementById('successMessage').classList.add('show');
            
            // Limpar formulário
            this.reset();
            
            // Esconder mensagem após 5 segundos
            setTimeout(function() {
                document.getElementById('successMessage').classList.remove('show');
            }, 5000);
        });
    </script>
</body>
</html>
